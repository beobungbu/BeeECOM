name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - name: Bundle Expo iOS
        run: pnpm --filter @beeecom/mobile bundle:ios
      - name: Bundle Expo Android
        run: pnpm --filter @beeecom/mobile bundle:android
      - name: Validate Cloudflare API deployment bundle
        run: |
          node scripts/render-cloudflare-api-config.mjs
          printf 'DEMO_RESET_TOKEN=ci-dry-run-only\n' > apps/api-worker/secrets.generated.env
          pnpm --filter @beeecom/api-worker exec wrangler deploy --dry-run --config wrangler.generated.json --secrets-file secrets.generated.env
      - name: Validate Cloudflare Storefront deployment bundle
        run: pnpm --filter @beeecom/api-worker exec wrangler deploy --dry-run --config ../storefront-web/wrangler.jsonc
      - name: Validate Cloudflare Admin deployment bundle
        run: pnpm --filter @beeecom/api-worker exec wrangler deploy --dry-run --config ../admin-web/wrangler.jsonc
      - name: Install Chromium for release E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: Release QA — Worker/D1/Web/Admin/realtime/a11y
        run: pnpm qa:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
