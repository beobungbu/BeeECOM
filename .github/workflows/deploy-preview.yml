name: Deploy Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beeecom-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      BEEECOM_D1_DATABASE_NAME: ${{ vars.BEEECOM_D1_DATABASE_NAME || 'beeecom-demo' }}
      BEEECOM_API_WORKER_NAME: ${{ vars.BEEECOM_API_WORKER_NAME || 'beeecom-api-preview' }}
      BEEECOM_API_BASE_URL: ${{ vars.BEEECOM_API_BASE_URL }}
      BEEECOM_CORS_ORIGINS: ${{ vars.BEEECOM_CORS_ORIGINS }}
      BEEECOM_DEFAULT_SCENARIO: ${{ vars.BEEECOM_DEFAULT_SCENARIO || 'healthy' }}
      BEEECOM_DEMO_RESET_TOKEN: ${{ secrets.BEEECOM_DEMO_RESET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile

      - name: Validate required preview configuration
        shell: bash
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo 'Missing CLOUDFLARE_D1_DATABASE_ID variable'; exit 1; }
          test -n "$BEEECOM_API_BASE_URL" || { echo 'Missing BEEECOM_API_BASE_URL variable'; exit 1; }
          test -n "$BEEECOM_CORS_ORIGINS" || { echo 'Missing BEEECOM_CORS_ORIGINS variable'; exit 1; }
          test -n "$BEEECOM_DEMO_RESET_TOKEN" || { echo 'Missing BEEECOM_DEMO_RESET_TOKEN secret'; exit 1; }

      - name: Verify exact source before deployment
        run: pnpm check

      - name: Render API deployment configuration
        run: |
          node scripts/render-cloudflare-api-config.mjs
          printf 'DEMO_RESET_TOKEN=%s\n' "$BEEECOM_DEMO_RESET_TOKEN" > apps/api-worker/secrets.generated.env

      - name: Apply D1 migrations
        run: pnpm --filter @beeecom/api-worker exec wrangler d1 migrations apply DB --remote --config wrangler.generated.json

      - name: Deploy API Worker and Durable Object
        run: pnpm --filter @beeecom/api-worker exec wrangler deploy --config wrangler.generated.json --secrets-file secrets.generated.env

      - name: Smoke test API health
        run: curl --fail --silent --show-error "$BEEECOM_API_BASE_URL/health"

      - name: Build Storefront against preview API
        env:
          VITE_API_BASE_URL: ${{ env.BEEECOM_API_BASE_URL }}
        run: pnpm --filter @beeecom/storefront-web build

      - name: Deploy Storefront Worker static assets
        run: pnpm --filter @beeecom/api-worker exec wrangler deploy --config ../storefront-web/wrangler.jsonc

      - name: Build Admin against preview API
        env:
          VITE_API_BASE_URL: ${{ env.BEEECOM_API_BASE_URL }}
        run: pnpm --filter @beeecom/admin-web build

      - name: Deploy Admin Worker static assets
        run: pnpm --filter @beeecom/api-worker exec wrangler deploy --config ../admin-web/wrangler.jsonc

      - name: Deployment summary
        run: |
          echo '### BeeECOM preview deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${BEEECOM_API_BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: ${BEEECOM_D1_DATABASE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- BeeUI: 0.86.2-rc.1" >> "$GITHUB_STEP_SUMMARY"
